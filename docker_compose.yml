version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://sih_admin:kavach_secure_99@db:5432/dhwani_kavach
      - REDIS_URL=redis://redis:6379/0

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: sih_admin
      POSTGRES_PASSWORD: kavach_secure_99
      POSTGRES_DB: dhwani_kavach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: